# dsh-subagent-model — surfaces the LLM model a Session actually runs on.
#
# Two seats, both presentation-only:
#
#   1. `conversation.session.header.actions` — a chip beside the session title
#      reading "model: <id>". A `kind: "list"` slot declared at
#      `dsh-client-ui-conversation/lib/client.js:18268-18271`, already carrying
#      the subagent catalog, the job list, the agent-preset label and the Agent
#      Team action (dsh-cordis-client-runner/lib/client.js:3544-3549). A fresh
#      `id` ADDS a cell rather than replacing one, which is what this wants:
#      the shipped pill stays.
#
#   2. `sidebar.session.row.hover` — a row inside each Session's hover card,
#      between its relative time and its trailing status line. Declared as
#      `kind: "list"` by `dsh-client-ui-workspace/lib/client.js:4322-4325` and
#      described at dsh-cordis-client-runner/lib/client.js:5636-5639. Its
#      shipped occupant is the schedule row
#      (`dsh-client-ui-schedule/lib/client.js:6855-6861`), so a fresh `id` adds
#      a second row beside it.
#
# The Host row exists for one reason: `@deepseek-ai/dsh-client-modules`
# discovers client packages by scanning the HOST Loader's live entries
# (`dsh-client-modules/lib/index.js:743-773 locatePkgJson`, `:701-731
# resolveMeta`), and a package with no live Loader row is never scanned and its
# browser half is never served. `src/index.js` is therefore an anchor, not a
# stub — see its module comment.
#
# Keep this list at exactly ONE row. The registry reconciles by package name
# and throws when one package resolves from more than one live Loader source
# (`reconcilePackage`, dsh-client-modules/lib/index.js:871-877); at activation
# that throw is rethrown as a `ClientPackageCompositionError`
# (`:541-544`), which FAILS the `dsh-client-modules` fiber and leaves the whole
# web shell without its `window.__ModuleLoader__` bootstrap — a whole-GUI-down
# failure, not a degraded one.
#
# This package must NOT declare a tool, a service, or a Config schema. It
# touches nothing the model can observe.
- insert:
    - id: subagent-model
      name: './src/index.js'

name: release

# One publish path, and it is not run by hand. `prepublishOnly` runs the full
# suite, so a release cannot skip it, and the tag is derived from the version in
# package.json so the two can never disagree.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance via OIDC, no long-lived token in the repo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: the suite must pass before anything ships
        run: npm test

      - name: the tag must match the version in package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(node -p "require('./package.json').version")"
          echo "tag=$TAG version=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag $TAG does not match package.json version $VER"
            exit 1
          fi

      # `npm view <pkg> <version>` exits 0 only when that exact version already
      # exists, so this is the "has this version been used before" check. It is
      # advisory rather than fatal: a transient registry failure must not block a
      # release that is otherwise correct, and npm refuses a duplicate version
      # anyway.
      - name: warn if that version already exists
        run: |
          VER="$(node -p "require('./package.json').version")"
          if npm view "$(node -p "require('./package.json').name")" "$VER" >/dev/null 2>&1; then
            echo "::warning::$VER is already published; npm will refuse the duplicate"
          fi

      - name: publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}